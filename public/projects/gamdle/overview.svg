<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Gamdle architecture</title>
  <desc id="desc">Diagram: a daily deterministic probability casino. Node.js backend with esbuild-bundled frontend, Postgres for persistence, magic-link auth via email webhook, and per-user-per-day seeding for deterministic daily outcomes.</desc>
  <rect width="1200" height="675" fill="#fbfbfa"/>
  <g font-family="ui-monospace, monospace" font-size="20" fill="#1c1b1a">
    <!-- Browser -->
    <rect x="60" y="80" width="260" height="120" rx="10" fill="#ffffff" stroke="#d6d3d0"/>
    <text x="190" y="125" text-anchor="middle">Browser</text>
    <text x="190" y="150" text-anchor="middle" font-size="15" fill="#6b6a68">esbuild-bundled app.js</text>
    <text x="190" y="175" text-anchor="middle" font-size="15" fill="#6b6a68">daily game UI</text>

    <!-- Node.js backend -->
    <rect x="440" y="80" width="260" height="120" rx="10" fill="#fde9d3" stroke="#b45309"/>
    <text x="570" y="125" text-anchor="middle">Node.js backend</text>
    <text x="570" y="150" text-anchor="middle" font-size="15" fill="#6b6a68">game logic · sessions</text>
    <text x="570" y="175" text-anchor="middle" font-size="15" fill="#6b6a68">daily seed per user</text>

    <line x1="320" y1="140" x2="440" y2="140" stroke="#b45309" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Postgres -->
    <rect x="820" y="80" width="220" height="120" rx="10" fill="#ffffff" stroke="#d6d3d0"/>
    <text x="930" y="125" text-anchor="middle">PostgreSQL</text>
    <text x="930" y="150" text-anchor="middle" font-size="15" fill="#6b6a68">users · scores</text>
    <text x="930" y="175" text-anchor="middle" font-size="15" fill="#6b6a68">daily results</text>
    <line x1="700" y1="140" x2="820" y2="140" stroke="#b45309" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Magic link flow -->
    <rect x="60" y="320" width="260" height="100" rx="10" fill="#ffffff" stroke="#d6d3d0"/>
    <text x="190" y="360" text-anchor="middle">Magic link auth</text>
    <text x="190" y="385" text-anchor="middle" font-size="15" fill="#6b6a68">passwordless · webhook</text>
    <line x1="190" y1="200" x2="190" y2="320" stroke="#b45309" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Email webhook -->
    <rect x="440" y="320" width="260" height="100" rx="10" fill="#ffffff" stroke="#d6d3d0"/>
    <text x="570" y="360" text-anchor="middle">Email webhook</text>
    <text x="570" y="385" text-anchor="middle" font-size="15" fill="#6b6a68">delivery · no SMTP owned</text>
    <line x1="320" y1="370" x2="440" y2="370" stroke="#b45309" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Daily seed -->
    <rect x="820" y="320" width="220" height="100" rx="10" fill="#ffffff" stroke="#d6d3d0"/>
    <text x="930" y="360" text-anchor="middle">Daily seed</text>
    <text x="930" y="385" text-anchor="middle" font-size="15" fill="#6b6a68">per user · per day</text>
    <line x1="700" y1="200" x2="930" y2="320" stroke="#b45309" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Docker -->
    <rect x="280" y="520" width="640" height="80" rx="10" fill="#ffffff" stroke="#d6d3d0"/>
    <text x="600" y="565" text-anchor="middle">Docker Compose — app + Postgres, deployed to Kubernetes via GitOps</text>
    <line x1="570" y1="200" x2="570" y2="520" stroke="#b45309" stroke-width="1.5" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#b45309"/>
    </marker>
  </defs>
</svg>
