<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Message Board architecture</title>
  <desc id="desc">Diagram: a FastAPI backend with Jinja2 templates and HTMX for dynamic UI, SQLAlchemy ORM with SQLite for dev and PostgreSQL for prod, deployed via Docker to the GitOps platform.</desc>
  <rect width="1200" height="675" fill="#fbfbfa"/>
  <g font-family="ui-monospace, monospace" font-size="20" fill="#1c1b1a">
    <!-- Browser -->
    <rect x="60" y="100" width="240" height="120" rx="10" fill="#ffffff" stroke="#d6d3d0"/>
    <text x="180" y="145" text-anchor="middle">Browser</text>
    <text x="180" y="170" text-anchor="middle" font-size="15" fill="#6b6a68">HTML + HTMX</text>
    <text x="180" y="195" text-anchor="middle" font-size="15" fill="#6b6a68">no JS framework</text>

    <!-- FastAPI -->
    <rect x="420" y="100" width="240" height="120" rx="10" fill="#fde9d3" stroke="#b45309"/>
    <text x="540" y="145" text-anchor="middle">FastAPI</text>
    <text x="540" y="170" text-anchor="middle" font-size="15" fill="#6b6a68">Jinja2 templates</text>
    <text x="540" y="195" text-anchor="middle" font-size="15" fill="#6b6a68">server-rendered</text>

    <line x1="300" y1="160" x2="420" y2="160" stroke="#b45309" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- SQLAlchemy -->
    <rect x="780" y="100" width="240" height="120" rx="10" fill="#ffffff" stroke="#d6d3d0"/>
    <text x="900" y="145" text-anchor="middle">SQLAlchemy ORM</text>
    <text x="900" y="170" text-anchor="middle" font-size="15" fill="#6b6a68">posts · users · threads</text>
    <line x1="660" y1="160" x2="780" y2="160" stroke="#b45309" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Dev DB -->
    <rect x="320" y="340" width="240" height="100" rx="10" fill="#ffffff" stroke="#d6d3d0"/>
    <text x="440" y="380" text-anchor="middle">SQLite (dev)</text>
    <text x="440" y="405" text-anchor="middle" font-size="15" fill="#6b6a68">zero-dependency local</text>
    <line x1="860" y1="220" x2="440" y2="340" stroke="#b45309" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Prod DB -->
    <rect x="700" y="340" width="240" height="100" rx="10" fill="#ffffff" stroke="#d6d3d0"/>
    <text x="820" y="380" text-anchor="middle">PostgreSQL (prod)</text>
    <text x="820" y="405" text-anchor="middle" font-size="15" fill="#6b6a68">Docker Compose</text>
    <line x1="900" y1="220" x2="820" y2="340" stroke="#b45309" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Docker / GitOps -->
    <rect x="320" y="520" width="620" height="80" rx="10" fill="#ffffff" stroke="#d6d3d0"/>
    <text x="630" y="565" text-anchor="middle">Docker → GitOps platform → msgbrd.murakams.com</text>
    <line x1="540" y1="220" x2="540" y2="520" stroke="#b45309" stroke-width="1.5" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#b45309"/>
    </marker>
  </defs>
</svg>
